name: Version upgrade

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      changed: ${{ steps.metadata.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate version and changelog
        id: metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/release_metadata.py
      - name: Check release safeguards
        run: python3 scripts/test_release_metadata.py
      - name: Tests, lint and builds
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.metadata.outputs.changed == 'true'
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish version tag and source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --target "$COMMIT" --title "Kalo $VERSION" --notes-file release-notes.md
          fi
